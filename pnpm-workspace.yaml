# App 只保留本地 tsconfig workspace；i18n 使用 GitHub Packages 精确版本。
# 产品源码不通过 sibling 相对路径或 file bridge 消费 i18n。
packages:
  - "."
  - "packages/*"
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.74'
  - '@ai-sdk/mcp@2.0.44'
  - '@ai-sdk/react@4.0.95'
  - ai@7.0.92
  - '@lordfoxfairy/i18n@0.1.0'
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
