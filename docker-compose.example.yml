services:
  kokoro:
    build:
      context: .
      dockerfile: Dockerfile
    image: kokoro-app:${KOKORO_IMAGE_TAG:-local}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # KOKORO_DOMAIN must be defined in .env; the server BFF generates RFC 7239 `Forwarded` upstream.
    ports:
      - "${KOKORO_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# 本仓库是一个独立产品 Web 部署。IAM、System、User、Session 等是外部服务，地址和凭据由 .env 注入。
# 浏览器不选择产品/租户；BFF 对每个上游请求统一覆盖并附加 Forwarded: host=<KOKORO_DOMAIN>。
