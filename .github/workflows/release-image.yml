name: Publish Kokoro Web image

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: kokoro-web-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan release source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Run contract, architecture, lint, typecheck, and tests
        run: |
          pnpm contract
          pnpm test:architecture
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Install Chromium for release browser gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release browser smoke
        run: pnpm test:e2e

  publish:
    name: Build, scan, sign, and publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local production candidate
        id: candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: kokoro-web:candidate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan candidate image before push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kokoro-web:candidate-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify candidate health and privacy headers
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f kokoro-web-candidate >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name kokoro-web-candidate --publish 3310:3000 \
            --env NODE_ENV=production \
            --env NEXT_PUBLIC_SESSION_PREVIEW=1 \
            --env KOKORO_DOMAIN=test.kokoro.localhost \
            kokoro-web:candidate-${{ github.sha }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 \
              --dump-header /tmp/kokoro-web-headers \
              http://127.0.0.1:3310/api/auth/session-state >/tmp/kokoro-web-body; then
              grep -qi '^x-content-type-options: nosniff' /tmp/kokoro-web-headers
              grep -qi '^cache-control: no-store' /tmp/kokoro-web-headers
              grep -q '"state":"preview"' /tmp/kokoro-web-body
              exit 0
            fi
            sleep 1
          done
          docker logs kokoro-web-candidate
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push verified image with SBOM and provenance
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
