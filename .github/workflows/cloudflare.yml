name: Deploy to Cloudflare Workers

# Deliberately manual production deploy. It is restricted below to an existing
# strict vMAJOR.MINOR.PATCH tag; branch dispatches are rejected before build.
# Cloudflare Workers Builds can also connect the repository directly; see
# docs/deployment.md for that path and for the separate preview command.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Cloudflare release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require strict semver production tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Cloudflare production deploys require an existing vMAJOR.MINOR.PATCH tag; branches and other refs are not deployable."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Cloudflare build
        run: pnpm run cf:build

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
